y{background:#fff}}.nj{display:none}.foy{display:grid;grid-template-columns:repeat(3,1fr);border:3px solid var(--ink);border-radius:6px;overflow:hidden;background:var(--card)}.foy .cell{border-left:2px dashed var(--ln);border-radius:0;min-height:120px}.foy .cell:first-child{border-left:0}.foy .cell{padding:6px 7px}.foy .cell .n{font-size:13px;line-height:1.15;overflow-wrap:anywhere}.foy .hd{flex-direction:column;align-items:flex-start;gap:3px}.foy .fm{font-size:11px;white-space:normal;overflow:visible}.foy .cell .mu{font-size:11px;line-height:1.2}.foy .tag{font-size:10px}.sc{position:fixed;inset:0;background:#0007;z-index:4}.sh{position:fixed;left:0;right:0;bottom:0;max-width:640px;margin:0 auto;background:var(--card);border-radius:18px 18px 0 0;padding:16px 14px calc(16px + env(safe-area-inset-bottom,0px));max-height:88vh;overflow:auto;z-index:5;box-shadow:0 -8px 30px #0006}</style></head><body>

(function seed(){
 for(let i=1;i<=10;i++)S.rooms.push({id:uid(),n:'Sala '+i});
 ['Sala 11','Sala 12','Fira Sala 1','Fira Sala 2','Fira Polivalent','Foyer'].forEach(n=>S.rooms.push({id:uid(),n}));
 [['Cadira congressos negra',220,'c','#1b1b1f'],['Cadira congressos blava',190,'c','#2b59c3'],['Cadira negra amb pala',95,'o','#555555'],['Taula sleight estreta',120,'t','#999999'],['Taula sleight ampla',40,'t','#999999']].forEach(a=>S.stock.push({id:uid(),n:a[0],q:a[1],k:a[2],col:a[3]}));
 [['Teatre',0],['Escola',0.5],['Taules en U',0.4],['Taula imperial',0.3]].forEach(a=>S.formats.push({id:uid(),n:a[0],r:a[1],fc:null,ft:null}));

function sv(){clearTimeout(tm);tm=setTimeout(async()=>{try{const d=JSON.parse(JSON.stringify(S));if(dbRef)await dbRef.set(d);else localStorage.setItem('pm',JSON.stringify(d))}catch(e){}},400)}
async function init(){
 try{if(window.claude&&claude.use){const db=await claude.use('db');if(db){dbRef=db.doc('app/state');const s=await dbRef.get();if(s.exists){const d=JSON.parse(JSON.stringify(s.data()));S={rooms:[],stock:[],formats:[],acts:[],...d}}document.getElementById('st').textContent='Dades desades al teu compte.'}}}catch(e){dbRef=null}
 if(!dbRef){try{const l=localStorage.getItem('pm');if(l)S=JSON.parse(l)}catch(e){}document.getElementById('st').textContent='Mode local: les dades només es guarden en aquest navegador.'}
 render()}
const F=(l,id)=>S[l].find(x=>x.id==id)||{};
const colr=s=>s.col||PAL[S.stock.indexOf(s)%5];
const opts=(l,sel)=>S[l].map(x=>`<option value="${x.id}"${x.id==sel?' selected':''}>${esc(x.n)}</option>`).join('');

function up(l,id,f,v,num){const o=F(l,id);o[f]=num?(v===''?null:+v):v;sv();render()}

function addI(l){const o={rooms:{n:'Nova sala'},stock:{n:'Nou element',q:0,k:'o',col:'#888888'},formats:{n:'Nou format',r:0,fc:null,ft:null}}[l];S[l].unshift({id:uid(),...o});sv();render();window.scrollTo&&window.scrollTo(0,0);setTimeout(()=>{const i=document.querySelector&&document.querySelector('#app input.name');if(i){i.focus();i.select()}},60)}
function newAct(){const a={id:uid(),n:'Nou acte',d:TD,rows:[]};S.acts.push(a);AE=a.id;sv();render()}
function actUp(id,f,v){F('acts',id)[f]=v;sv();render()}
function addRow(id){F('acts',id).rows.push({rooms:[],fmt:S.formats[0]&&S.formats[0].id,c:0,t:0});sv();render()}
function delRow(id,i){F('acts',id).rows.splice(i,1);sv();render()}
function rowUp(id,i,f,v){const r=F('acts',id).rows[i],fm=F('formats',r.fmt);
 if(f=='room')r.rooms=tg(RM(r),v,true);else if(f=='t')r.t=+v||0;
 else if(f=='fmt'){r.fmt=v;const n=F('formats',v);if(n.fc!=null){r.c=n.fc;r.t=n.ft||0;r.p=n.fp||0;r.x=JSON.parse(JSON.stringify(n.fx||[]))}}
 else if(f=='c')r.c=+v||0;
 sv();render()}
function fixT(id,fix){const o=F('formats',id);if(fix){o.fc=0;o.ft=0}else{o.fc=null;o.ft=null}sv();render()}
function fRatio(id,v){F('formats',id).r=(+v||0)/10;sv();render()}
function alloc(d){
 const rem={};S.stock.filter(s=>s.k=='c').forEach(s=>rem[s.id]=s.q);const ox={};S.stock.filter(s=>s.k=='p'||s.k=='o').forEach(s=>ox[s.id]=s.q);const pS=S.stock.find(s=>s.k=='p');
 let tab=S.stock.filter(s=>s.k=='t').reduce((a,s)=>a+s.q,0);const items=[];
 S.acts.filter(a=>a.d==d).forEach(a=>a.rows.forEach(r=>items.push({a:a.n,r})));
 items.sort((x,y)=>y.r.c-x.r.c);
 items.forEach(it=>{let need=it.r.c;it.p=[];const ids=Object.keys(rem);
  const fit=ids.filter(i=>rem[i]>=need).sort((x,y)=>rem[x]-rem[y])[0];
  if(fit){it.p.push([fit,need]);rem[fit]-=need;need=0}
  else{ids.sort((x,y)=>rem[y]-rem[x]);for(const i of ids){if(!need)break;const t=Math.min(rem[i],need);if(t>0){it.p.push([i,t]);rem[i]-=t;need-=t}}}
  it.m=need;tab-=it.r.t;if(pS)ox[pS.id]-=it.r.p||0;(it.r.x||[]).forEach(e=>{if(e.id in ox)ox[e.id]-=e.q})});
 return{items,rem,tab,ox}}
const dl=d=>new Date(d+'T12:00').toLocaleDateString('ca',{weekday:'short',day:'numeric',month:'short'});
const qx=(r,id)=>((r.x||[]).find(e=>e.id==id)||{}).q||0;
function mv(p,n){const nm=r=>`${esc(F('formats',r.fmt).n)} · ${r.c} cad · ${r.t} tau${r.p?' · '+r.p+' pres':''}${(r.x||[]).map(e=>' · '+e.q+' '+esc(F('stock',e.id).n)).join('')}`;if(!p)return['mt','Muntar',nm(n)];if(!n)return['dm','Desmuntar',nm(p)];const d=[],df=(a,b,l)=>{if(a!=b)d.push(`${l} ${b>a?'+':''}${b-a}`)};if(p.fmt!=n.fmt)d.push(`Format: ${esc(F('formats',p.fmt).n)} → ${esc(F('formats',n.fmt).n)}`);df(p.c,n.c,'Cadires');df(p.t,n.t,'Taules');df(p.p||0,n.p||0,'Presidència');new Set([...(p.x||[]),...(n.x||[])].map(e=>e.id)).forEach(id=>df(qx(p,id),qx(n,id),esc(F('stock',id).n)));if(RM(p).length!=RM(n).length)d.push(RM(n).length>RM(p).length?'Obrir panell':'Tancar panell');return d.length?['cv','Canvi',d.join(' · ')]:['ig','Es manté','']}
function vML(){const ds=[...new Set(S.acts.filter(a=>a.id!='live').map(a=>a.d))].sort();if(ds.length<2)return `<p class='mu'>Cal almenys dos dies amb actes per veure els moviments.</p>`;const rowOf=(d,id)=>{let r=null;S.acts.filter(a=>a.d==d&&a.id!='live').forEach(a=>a.rows.forEach(x=>{if(!x.empty&&RM(x).includes(id))r=x}));return r};let h='';for(let i=1;i<ds.length;i++){const d1=ds[i-1],d2=ds[i],seen={},L=[];S.rooms.slice().sort((a,b)=>pn(b)-pn(a)).forEach(o=>{const p=rowOf(d1,o.id),n=rowOf(d2,o.id);if(!p&&!n)return;const gp=p?RM(p).slice().sort().join():'',gn=n?RM(n).slice().sort().join():'',same=gp==gn,k=same?gp:o.id;if(seen[k])return;seen[k]=1;const ids=same?[...new Set([...(p?RM(p):[]),...(n?RM(n):[])])]:[o.id],m=mv(p,n),nmz=r=>RM(r).map(i=>F('rooms',i).n).join(' + ');if(!same&&p&&!n&&RM(p).length>1)m[2]='Formava part de '+esc(nmz(p));if(!same&&n&&!p&&RM(n).length>1)m[2]='Passa a formar part de '+esc(nmz(n))+' · '+m[2];L.push(`<div class='it'><b>${esc(ids.map(id=>F('rooms',id).n).join(' + '))}</b> <span class='tag ${m[0]}'>${m[1]}</span><div class='mu'>${m[2]}</div></div>`)});h+=`<h2>${dl(d1)} → ${dl(d2)}</h2><div class='c'>${L.join('')||`<p class='mu'>Cap moviment</p>`}</div>`}return h}
const lf=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const days=()=>[...new Set(S.acts.filter(a=>a.id!='live').map(a=>a.d))].sort();
function rowOf(d,id){let r=null;if(d)S.acts.filter(a=>a.d==d&&a.id!='live').forEach(a=>a.rows.forEach(x=>{if(!x.empty&&RM(x).includes(id))r=x}));return r}
function trn(d1,d2){const seen={},L=[];S.rooms.slice().sort((a,b)=>pn(b)-pn(a)).forEach(o=>{const p=rowOf(d1,o.id),n=rowOf(d2,o.id);if(!p&&!n)return;const gp=p?RM(p).slice().sort().join():'',gn=n?RM(n).slice().sort().join():'',same=gp==gn,k=same?gp:o.id;if(seen[k])return;seen[k]=1;const ids=same?[...new Set([...(p?RM(p):[]),...(n?RM(n):[])])]:[o.id],m=mv(p,n),nz=r=>esc(RM(r).map(i=>F('rooms',i).n).join(' + '));if(!same&&p&&!n&&RM(p).length>1)m[2]='Formava part de '+nz(p);if(!same&&n&&!p&&RM(n).length>1)m[2]='Passa a formar part de '+nz(n)+' · '+m[2];L.push({o,ids,m})});return L}
function addN(d){const i=document.getElementById('ni'+d);if(!i||!i.value.trim())return;(S.notes=S.notes||[]).push({id:uid(),d,t:i.value.trim()});sv();render()}

async function expoHTML(t){const e=document.getElementById('app').cloneNode(true);e.querySelectorAll('.noprint,.sh,.sc').forEach(n=>n.remove());const css=document.querySelector('style').textContent,h=`<!DOCTYPE html><html lang='ca' data-theme='light'><head><meta charset='utf-8'><meta name='viewport' content='width=device-width,initial-scale=1'><title>${t}</title><style>${css}</style></head><body><h1>${t}</h1>${e.innerHTML}</body></html>`;try{const d=window.claude&&await claude.use('downloads');if(d){await d.save({filename:'muntatges-'+(t=='Moviments'?'moviments':'planol')+'-'+TD+'.html',data:h});return}}catch(x){if(x&&x.code=='declined')return}if(window.print)window.print()}

function mg(b,l,r){if(JS(l)==JS(r))return l;if(JS(l)==JS(b))return r;if(JS(r)==JS(b))return l;if(Array.isArray(l)&&Array.isArray(r)&&[...l,...r].every(x=>x&&typeof x=='object'&&x.id!=null)){const B=new Map((Array.isArray(b)?b:[]).map(x=>[x.id,x])),Lm=new Map(l.map(x=>[x.id,x])),Rm=new Map(r.map(x=>[x.id,x])),out=[];[...new Set([...l.map(x=>x.id),...r.map(x=>x.id)])].forEach(id=>{const bi=B.get(id),li=Lm.get(id),ri=Rm.get(id);if(li&&ri)out.push(mg(bi,li,ri));else if(li){if(!bi||JS(li)!=JS(bi))out.push(li)}else if(ri){if(!bi||JS(ri)!=JS(bi))out.push(ri)}});return out}if(l&&r&&typeof l=='object'&&typeof r=='object'&&!Array.isArray(l)&&!Array.isArray(r)){const o={},bb=b&&typeof b=='object'&&!Array.isArray(b)?b:{};new Set([...Object.keys(l),...Object.keys(r)]).forEach(k=>{if(k in l&&k in r)o[k]=mg(bb[k],l[k],r[k]);else if(k in l){if(!(k in bb)||JS(l[k])!=JS(bb[k]))o[k]=l[k]}else{if(!(k in bb)||JS(r[k])!=JS(bb[k]))o[k]=r[k]}});return o}return l}
